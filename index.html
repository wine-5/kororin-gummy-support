<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ころりんグミ</title>
<meta name="description" content="iOS のパズルゲーム「ころりんグミ」のサポートとプライバシーポリシー">
<link rel="icon" href="icon-256.png">
<link rel="apple-touch-icon" href="icon-256.png">
<style>
:root{--bg:#fff6f9;--card:#fff;--ink:#4a3a42;--sub:#7d6a73;--pink:#ff69aa;--pink-soft:#ffe0ec;--mint:#a7ddcc;--mint-soft:#e3f5ef;--line:#f3d5e1}
@media (prefers-color-scheme:dark){:root{--bg:#2a2226;--card:#352b30;--ink:#f6e9ef;--sub:#c9b5be;--pink:#ff8cbf;--pink-soft:#4a3340;--mint:#8fd0bb;--mint-soft:#2f4640;--line:#4d3c45}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Segoe UI",sans-serif;line-height:1.8;font-size:16px;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:40px 16px 56px;text-align:center}
.icon{width:128px;height:128px;border-radius:28px;box-shadow:0 8px 24px rgba(255,105,170,.25)}
h1{font-size:28px;margin:20px 0 0;letter-spacing:.04em}
.en{color:var(--sub);margin:0 0 20px;font-size:15px}
.lead{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px 20px;text-align:left;margin:0 0 24px}
.lead p{margin:0 0 8px}.lead p:last-child{margin:0}
nav{display:grid;gap:12px}
nav a{display:block;padding:14px 16px;border-radius:999px;text-decoration:none;font-weight:700;color:var(--ink);background:var(--mint-soft);border:2px solid var(--mint)}
nav a.primary{background:var(--pink);border-color:var(--pink);color:#fff}
footer{margin-top:40px;color:var(--sub);font-size:13px}
</style>
</head>
<body>
<main>
<img class="icon" src="icon-256.png" alt="ころりんグミのアイコン" width="128" height="128">
<h1>ころりんグミ</h1>
<p class="en">Kororin Gummy</p>
<div class="lead">
<p>指で線を描いて、グミをゴールまで転がすパズルゲームです。インクの量には限りがあるので、短い線で届く道を探します。</p>
<p lang="en">Draw lines with your finger and roll the gummy to the goal. Ink is limited, so look for the shortest way there.</p>
</div>
<nav>
<a class="primary" href="support.html">サポート / Support</a>
<a href="privacy.html">プライバシーポリシー</a>
<a href="privacy-en.html" lang="en">Privacy Policy (English)</a>
</nav>
<footer>© 2026 WineEngine 開発チーム</footer>
</main>
</body>
</html>
